
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현장 일정 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#f4f6fb;--surface:#fff;--surface2:#f0f2f8;--surface3:#e4e8f4;
  --border:#e2e6f0;--border2:#d0d6e8;--text:#1a1f36;--text2:#4a5270;--text3:#9aa3c0;
  --radius:10px;--shadow:0 4px 20px rgba(60,80,160,.08);--shadow2:0 2px 8px rgba(60,80,160,.06);
  --c-희은:#d97706;--c-나래:#0891b2;--c-상민:#6d28d9;--c-준호:#db2777;
  --c-광희:#2563eb;--c-현준:#16a34a;--c-정만:#ea580c;
  --t-설치-bg:#dcfce7;--t-설치-c:#15803d;
  --t-수거-bg:#ffedd5;--t-수거-c:#c2410c;
  --t-AS-bg:#fee2e2;--t-AS-c:#dc2626;
  --t-이전-bg:#dbeafe;--t-이전-c:#1d4ed8;
  --t-설치수거-bg:#ede9fe;--t-설치수거-c:#6d28d9;
  --t-기타-bg:#f1f5f9;--t-기타-c:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:var(--shadow2)}
.logo{font-size:15px;font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;color:var(--text)}
.logo-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#6d28d9);display:flex;align-items:center;justify-content:center;font-size:14px}
.header-right{display:flex;align-items:center;gap:7px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .14s;font-family:inherit}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-danger{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}.btn-danger:hover{background:#fecaca}
/* 탭 */
.tabs-wrap{background:var(--surface);border-bottom:2px solid var(--border);padding:0 20px}
.tabs-role{display:flex;align-items:stretch;overflow-x:auto}
.tabs-role::-webkit-scrollbar{height:0}
.role-group{display:flex;align-items:stretch;position:relative}
.role-group+.role-group{border-left:2px solid var(--border2);padding-left:4px;margin-left:4px}
.role-label{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px 0;color:var(--text3);white-space:nowrap;position:absolute;top:0;left:8px}
.staff-tab{padding:28px 14px 8px;font-size:12px;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--text3);border-bottom:3px solid transparent;white-space:nowrap;transition:all .14s;display:flex;align-items:center;gap:5px;font-family:inherit;position:relative}
.staff-tab:hover{color:var(--text2);background:var(--surface2)}
.staff-tab.active{color:var(--text);border-bottom-color:var(--tab-color,#2563eb)}
.tab-dot{width:7px;height:7px;border-radius:50%}
.tab-count{font-size:10px;padding:1px 6px;border-radius:10px;font-family:'JetBrains Mono';font-weight:600}
.role-booker .tab-count{background:#ede9fe;color:#6d28d9}
.role-worker .tab-count{background:#dbeafe;color:#2563eb}
.tab-all .tab-count{background:var(--surface3);color:var(--text2)}
/* 레이아웃 */
.app{display:flex;height:calc(100vh - 54px - 50px)}
.sidebar{width:210px;min-width:210px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sb-section{padding:14px;border-bottom:1px solid var(--border)}
.sb-title{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:10px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat-card{background:var(--surface2);border-radius:8px;padding:10px;border:1px solid var(--border)}
.stat-n{font-size:20px;font-weight:900;font-family:'JetBrains Mono'}
.stat-l{font-size:10px;color:var(--text2);margin-top:1px}
.type-filters{display:flex;flex-direction:column;gap:2px}
.tf-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12px;transition:background .12s;border:none;background:transparent;color:var(--text2);font-family:inherit;width:100%;text-align:left}
.tf-item:hover{background:var(--surface2)}.tf-item.active{background:var(--surface2);color:var(--text);font-weight:700}
.tf-badge{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:800}
.leave-list{display:flex;flex-direction:column;gap:4px}
.leave-item{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--surface2);border-radius:6px;font-size:11px;border:1px solid var(--border)}
.leave-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
/* 메인 */
.main{flex:1;overflow-y:auto;padding:16px 18px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{font-size:20px;font-weight:900;letter-spacing:-1px}
.cal-nav{display:flex;gap:5px;align-items:center}
.nav-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .12s}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.dow{text-align:center;font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--text3);padding:4px 0}
.dow:first-child{color:#dc2626}.dow:last-child{color:#2563eb}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{min-height:115px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:7px;cursor:pointer;transition:border-color .12s,box-shadow .12s;position:relative;overflow:hidden;box-shadow:var(--shadow2)}
.cal-cell:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.cal-cell.today{border-color:#2563eb;border-width:2px}
.cal-cell.other-month{opacity:.35;background:var(--surface2)}
.cal-cell.sunday .day-num{color:#dc2626}.cal-cell.saturday .day-num{color:#2563eb}
.day-num{font-size:12px;font-weight:700;font-family:'JetBrains Mono';margin-bottom:4px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;color:var(--text)}
.today-pip{background:#2563eb;color:#fff;border-radius:3px;padding:0 4px;font-size:9px;font-family:'Noto Sans KR'}
.cell-leave{font-size:9px;padding:1px 5px;border-radius:3px;margin-bottom:3px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.ev-chip{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-bottom:2px;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .12s}
.ev-chip:hover{opacity:.75}
.ev-chip .staff-pip{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.ev-chip .warn{font-size:9px;margin-left:auto;flex-shrink:0}
.more-chip{font-size:10px;color:var(--text3);padding:1px 4px;font-style:italic}
/* 로딩 */
.loading-bar{position:fixed;top:0;left:0;height:3px;background:#2563eb;z-index:9999;transition:width .3s;width:0}
.loading-bar.active{width:70%}.loading-bar.done{width:100%;opacity:0;transition:width .2s,opacity .5s .2s}
/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(30,40,80,.35);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(30,40,120,.18);transform:translateY(14px);transition:transform .2s}
.overlay.open .modal{transform:none}
.modal-sm{width:460px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-size:14px;font-weight:800;color:var(--text)}
.modal-close{width:28px;height:28px;border-radius:7px;border:none;background:var(--surface2);color:var(--text2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--surface3);color:var(--text)}
.modal-body{padding:20px}
.modal-foot{padding:13px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:7px;position:sticky;bottom:0;background:var(--surface)}
.f-row{margin-bottom:14px}.f-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.f-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
label{display:block;font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.4px;margin-bottom:5px}
label .req{color:#2563eb;margin-left:2px}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;font-family:'Noto Sans KR',sans-serif;transition:border-color .12s;outline:none}
input:focus,select:focus,textarea:focus{border-color:#2563eb;background:#fff}
select option{background:#fff}
textarea{resize:vertical;min-height:70px;line-height:1.6}
input[type=time]{font-family:'JetBrains Mono'}
.role-section{margin-bottom:8px}
.role-section-label{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;padding:3px 8px;border-radius:5px;display:inline-block}
.role-section-label.booker{background:#ede9fe;color:#6d28d9}
.role-section-label.worker{background:#dbeafe;color:#2563eb}
.staff-sel{display:flex;flex-wrap:wrap;gap:6px}
.s-btn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:2px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .12s;font-family:inherit;display:flex;align-items:center;gap:5px}
.s-btn:hover{background:var(--surface3)}.s-btn.on{color:#fff;border-color:transparent}
.type-sel{display:flex;flex-wrap:wrap;gap:6px}
.t-btn{padding:5px 13px;border-radius:6px;font-size:11px;font-weight:800;border:2px solid transparent;cursor:pointer;transition:all .14s;font-family:inherit;opacity:.45}
.t-btn.on{opacity:1;transform:scale(1.06);border-color:currentColor}
.kw-visit{color:#d97706;font-weight:700;background:#fef3c7;border-radius:2px;padding:0 2px}
.kw-pw{color:#0891b2;font-weight:700;background:#cffafe;border-radius:2px;padding:0 2px}
.kw-move{color:#dc2626;font-weight:700;background:#fee2e2;border-radius:2px;padding:0 2px}
.kw-care{color:#6d28d9;font-weight:700;background:#ede9fe;border-radius:2px;padding:0 2px}
.ev-card{background:var(--surface2);border-radius:10px;padding:13px;border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.ev-card:hover{border-color:#2563eb;box-shadow:var(--shadow)}
.ev-card-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.ev-type-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;flex-shrink:0;margin-top:2px}
.ev-building{font-size:14px;font-weight:700;color:var(--text)}
.ev-time{font-size:11px;color:var(--text2);margin-top:2px;font-family:'JetBrains Mono'}
.ev-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.ev-tag{font-size:10px;color:var(--text2);background:var(--surface3);padding:2px 7px;border-radius:4px;display:flex;align-items:center;gap:3px;border:1px solid var(--border)}
.ev-memo{font-size:11px;color:var(--text2);margin-top:8px;line-height:1.6;border-top:1px solid var(--border);padding-top:8px}
.warn-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:#fef3c7;color:#d97706;border:1px solid #fde68a;border-radius:4px;padding:1px 6px;margin-top:5px;font-weight:700}
.leave-row{display:flex;align-items:center;gap:6px;background:var(--surface2);padding:7px 10px;border-radius:7px;border:1px solid var(--border);margin-bottom:5px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-left:3px solid #16a34a;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;box-shadow:var(--shadow);z-index:1000;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;color:var(--text)}
.toast.show{opacity:1;transform:none}.toast.warn{border-left-color:#d97706}.toast.err{border-left-color:#dc2626}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.cal-cell{animation:fadeUp .2s both}
.empty{text-align:center;padding:28px;color:var(--text3);font-size:12px}
.empty-icon{font-size:28px;display:block;margin-bottom:7px}
.divider{height:1px;background:var(--border);margin:12px 0}
.sync-indicator{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#16a34a}
.sync-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
<div id="lock-screen" style="position:fixed;inset:0;background:#f4f6fb;display:flex;align-items:center;justify-content:center;z-index:9999"><div style="background:#fff;border-radius:16px;padding:40px;box-shadow:0 8px 32px rgba(60,80,160,.12);text-align:center;width:320px"><div style="font-size:32px;margin-bottom:16px">🔐</div><div style="font-size:18px;font-weight:900;color:#1a1f36;margin-bottom:8px">현장 일정 관리</div><div style="font-size:13px;color:#9aa3c0;margin-bottom:24px">접근 비밀번호를 입력해주세요</div><input id="lock-pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')checkPw()" style="width:100%;padding:11px;border:1px solid #e2e6f0;border-radius:8px;font-size:14px;outline:none;text-align:center;margin-bottom:12px"><div id="lock-err" style="font-size:12px;color:#dc2626;margin-bottom:10px;display:none">비밀번호가 틀렸어요</div><button onclick="checkPw()" style="width:100%;padding:11px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">확인</button></div></div>
<script>function checkPw(){if(document.getElementById('lock-pw').value==='47886'){document.getElementById('lock-screen').style.display='none';sessionStorage.setItem('auth','ok')}else{document.getElementById('lock-err').style.display='block';document.getElementById('lock-pw').value=''}}if(sessionStorage.getItem('auth')==='ok'){document.addEventListener('DOMContentLoaded',()=>{document.getElementById('lock-screen').style.display='none'})}</script>
<div class="loading-bar" id="loading-bar"></div>

<header>
  <div class="logo"><div class="logo-icon">📋</div>현장 일정 관리</div>
  <div class="header-right">
    <div class="sync-indicator"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">연결 중...</span></div>
    <button class="btn btn-ghost btn-sm" onclick="openLeaveModal()">📅 연차/반차</button>
    <button class="btn btn-ghost btn-sm" onclick="doSearch()">🔍 검색</button>
    <button class="btn btn-primary btn-sm" onclick="openAddModal()">＋ 일정 추가</button>
  </div>
</header>

<!-- 탭 바 -->
<div class="tabs-wrap">
  <div class="tabs-role">
    <button class="staff-tab tab-all active" data-staff="전체" style="--tab-color:#64748b;padding-top:14px" onclick="switchTab('전체',this)">
      <span class="tab-dot" style="background:#94a3b8"></span>전체<span class="tab-count" id="tc-전체">0</span>
    </button>
    <div class="role-group role-booker">
      <span class="role-label" style="color:#6d28d9">예약자</span>
      <button class="staff-tab" data-staff="희은" style="--tab-color:var(--c-희은)" onclick="switchTab('희은',this)"><span class="tab-dot" style="background:var(--c-희은)"></span>김희은<span class="tab-count" id="tc-희은">0</span></button>
      <button class="staff-tab" data-staff="나래" style="--tab-color:var(--c-나래)" onclick="switchTab('나래',this)"><span class="tab-dot" style="background:var(--c-나래)"></span>김나래<span class="tab-count" id="tc-나래">0</span></button>
      <button class="staff-tab" data-staff="상민" style="--tab-color:var(--c-상민)" onclick="switchTab('상민',this)"><span class="tab-dot" style="background:var(--c-상민)"></span>이상민<span class="tab-count" id="tc-상민">0</span></button>
      <button class="staff-tab" data-staff="준호" style="--tab-color:var(--c-준호)" onclick="switchTab('준호',this)"><span class="tab-dot" style="background:var(--c-준호)"></span>장준호<span class="tab-count" id="tc-준호">0</span></button>
    </div>
    <div class="role-group role-worker">
      <span class="role-label" style="color:#2563eb">출동 기사</span>
      <button class="staff-tab" data-staff="광희" style="--tab-color:var(--c-광희)" onclick="switchTab('광희',this)"><span class="tab-dot" style="background:var(--c-광희)"></span>이광희<span class="tab-count" id="tc-광희">0</span></button>
      <button class="staff-tab" data-staff="현준" style="--tab-color:var(--c-현준)" onclick="switchTab('현준',this)"><span class="tab-dot" style="background:var(--c-현준)"></span>이현준<span class="tab-count" id="tc-현준">0</span></button>
      <button class="staff-tab" data-staff="정만" style="--tab-color:var(--c-정만)" onclick="switchTab('정만',this)"><span class="tab-dot" style="background:var(--c-정만)"></span>박정만<span class="tab-count" id="tc-정만">0</span></button>
    </div>
  </div>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="sb-section">
      <div class="sb-title">이번 달</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-n" id="st-total" style="color:#2563eb">0</div><div class="stat-l">전체</div></div>
        <div class="stat-card"><div class="stat-n" id="st-install" style="color:#16a34a">0</div><div class="stat-l">설치</div></div>
        <div class="stat-card"><div class="stat-n" id="st-collect" style="color:#ea580c">0</div><div class="stat-l">수거</div></div>
        <div class="stat-card"><div class="stat-n" id="st-as" style="color:#dc2626">0</div><div class="stat-l">AS</div></div>
      </div>
    </div>
    <div class="sb-section">
      <div class="sb-title">업무 유형</div>
      <div class="type-filters">
        <button class="tf-item active" data-type="전체" onclick="switchType('전체',this)"><span class="tf-badge" style="background:var(--surface3);color:var(--text2)">ALL</span>전체</button>
        <button class="tf-item" data-type="설치" onclick="switchType('설치',this)"><span class="tf-badge" style="background:var(--t-설치-bg);color:var(--t-설치-c)">설치</span>신규 설치</button>
        <button class="tf-item" data-type="수거" onclick="switchType('수거',this)"><span class="tf-badge" style="background:var(--t-수거-bg);color:var(--t-수거-c)">수거</span>장비 수거</button>
        <button class="tf-item" data-type="AS" onclick="switchType('AS',this)"><span class="tf-badge" style="background:var(--t-AS-bg);color:var(--t-AS-c)">AS</span>A/S</button>

<script>
// ════ Supabase 연결 ════
const SUPABASE_URL = 'https://dkwptyilnwkievakbjno.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1Nces9uIrIthIX05co0s4w_OmtSJ2M_';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ════ 상수 ════
const STAFF_COLOR={희은:'#d97706',나래:'#0891b2',상민:'#6d28d9',준호:'#db2777',광희:'#2563eb',현준:'#16a34a',정만:'#ea580c'};
const STAFF_NAME={희은:'김희은',나래:'김나래',상민:'이상민',준호:'장준호',광희:'이광희',현준:'이현준',정만:'박정만'};
const ROLE_BOOKER=['희은','나래','상민','준호'];
const ROLE_WORKER=['광희','현준','정만'];
const TYPE_STYLE={'설치':{bg:'#dcfce7',c:'#15803d'},'수거':{bg:'#ffedd5',c:'#c2410c'},'AS':{bg:'#fee2e2',c:'#dc2626'},'이전':{bg:'#dbeafe',c:'#1d4ed8'},'설치+수거':{bg:'#ede9fe',c:'#6d28d9'},'기타':{bg:'#f1f5f9',c:'#64748b'}};
const KW=[{re:/방문\s*전\s*연락|미리\s*연락/g,cls:'kw-visit'},{re:/비번|비밀번호/g,cls:'kw-pw'},{re:/당일\s*이사|전출|이사/g,cls:'kw-move'},{re:/외국인|중국인/g,cls:'kw-care'}];

let events=[], leaves=[];
let curY, curM, tabStaff='전체', tabType='전체';
let editId=null, dayDate=null, selStaff=[], selType=null;

// ════ 초기화 ════
(async function init(){
  const n=new Date(); curY=n.getFullYear(); curM=n.getMonth();
  setSyncing(true);
  await loadAll();
  setSyncing(false);
  render();
  subscribeRealtime();
})();

// ════ Supabase CRUD ════
async function loadAll(){
  const [evRes, lvRes] = await Promise.all([
    db.from('events').select('*').order('sort_time',{ascending:true}),
    db.from('leaves').select('*').order('date',{ascending:true})
  ]);
  if(evRes.data) events = evRes.data.map(dbToEvent);
  if(lvRes.data) leaves = lvRes.data.map(dbToLeave);
}

function dbToEvent(r){
  return {id:r.id,date:r.date,dispTime:r.disp_time,sortTime:r.sort_time,staff:r.staff||[],type:r.type,building:r.building,room:r.room,phone:r.phone,pw:r.pw,service:r.service,memo:r.memo};
}
function dbToLeave(r){
  return {id:r.id,date:r.date,staff:r.staff,type:r.type};
}
function eventToDb(ev){
  return {id:ev.id,date:ev.date,disp_time:ev.dispTime,sort_time:ev.sortTime,staff:ev.staff,type:ev.type,building:ev.building,room:ev.room,phone:ev.phone,pw:ev.pw,service:ev.service,memo:ev.memo};
}

async function upsertEvent(ev){
  setSyncing(true);
  const {error}=await db.from('events').upsert(eventToDb(ev));
  setSyncing(false);
  if(error){toast('저장 실패: '+error.message,'err');return false}
  return true;
}
async function removeEvent(id){
  setSyncing(true);
  const {error}=await db.from('events').delete().eq('id',id);
  setSyncing(false);
  if(error){toast('삭제 실패','err');return false}
  return true;
}
async function upsertLeave(lv){
  setSyncing(true);
  const {error}=await db.from('leaves').upsert({id:lv.id,date:lv.date,staff:lv.staff,type:lv.type});
  setSyncing(false);
  if(error){toast('저장 실패','err');return false}
  return true;
}
async function removeLeave(id){
  setSyncing(true);
  const {error}=await db.from('leaves').delete().eq('id',id);
  setSyncing(false);
  if(error){toast('삭제 실패','err');return false}
  return true;
}

// ════ 실시간 동기화 ════
function subscribeRealtime(){
  db.channel('realtime-all')
    .on('postgres_changes',{event:'*',schema:'public',table:'events'},()=>{loadAll().then(render)})
    .on('postgres_changes',{event:'*',schema:'public',table:'leaves'},()=>{loadAll().then(render)})
    .subscribe(status=>{
      if(status==='SUBSCRIBED'){
        document.getElementById('sync-dot').classList.remove('syncing');
        document.getElementById('sync-text').textContent='실시간 연결됨';
      }
    });
}

// ════ 로딩/싱크 UI ════
function setSyncing(on){
  const dot=document.getElementById('sync-dot');
  const txt=document.getElementById('sync-text');
  const bar=document.getElementById('loading-bar');
  if(on){dot.classList.add('syncing');txt.textContent='저장 중...';bar.className='loading-bar active'}
  else{dot.classList.remove('syncing');txt.textContent='실시간 연결됨';bar.className='loading-bar done';setTimeout(()=>bar.className='loading-bar',700)}
}

// ════ 렌더 ════
function render(){
  document.getElementById('cal-title').textContent=`${curY}년 ${curM+1}월`;
  const y=curY,m=curM,firstDow=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();
  const filtered=getFiltered(), overlapMap=buildOverlapMap();
  updateSidebar(filtered); updateTabCounts(); updateLeaveSidebar();
  const grid=document.getElementById('cal-grid'); grid.innerHTML='';
  for(let i=0;i<firstDow;i++) grid.appendChild(makeCell(new Date(y,m-1,prev-firstDow+i+1),true,filtered,overlapMap));
  for(let d=1;d<=days;d++){const dt=new Date(y,m,d);const cell=makeCell(dt,false,filtered,overlapMap);if(dt.toDateString()===new Date().toDateString())cell.classList.add('today');cell.style.animationDelay=(d*0.007)+'s';grid.appendChild(cell)}
  const rem=(firstDow+days)%7;if(rem>0)for(let i=1;i<=7-rem;i++)grid.appendChild(makeCell(new Date(y,m+1,i),true,filtered,overlapMap));
}

function makeCell(dt,other,filtered,overlapMap){
  const ds=fmtDate(dt),dow=dt.getDay();
  let dayEvs=filtered.filter(e=>e.date===ds).sort((a,b)=>(a.sortTime||'99:99').localeCompare(b.sortTime||'99:99'));
  const dayLeaves=leaves.filter(l=>l.date===ds);
  const cell=document.createElement('div');
  cell.className='cal-cell'+(other?' other-month':'')+(dow===0?' sunday':dow===6?' saturday':'');
  const dayNum=document.createElement('div');dayNum.className='day-num';
  dayNum.innerHTML=dt.getDate()+(dt.toDateString()===new Date().toDateString()?' <span class="today-pip">오늘</span>':'');
  cell.appendChild(dayNum);
  dayLeaves.forEach(lv=>{const sc=STAFF_COLOR[lv.staff]||'#888';const b=document.createElement('div');b.className='cell-leave';b.style.cssText=`background:${sc}20;color:${sc};border:1px solid ${sc}50`;b.textContent=`${lv.staff} ${lv.type}`;cell.appendChild(b)});
  dayEvs.slice(0,4).forEach(ev=>{
    const ts=TYPE_STYLE[ev.type]||TYPE_STYLE['기타'],isOv=isEvOverlap(ev,overlapMap);
    const chip=document.createElement('div');chip.className='ev-chip';chip.style.cssText=`background:${ts.bg};color:${ts.c}`;
    const bookers=(ev.staff||[]).filter(s=>ROLE_BOOKER.includes(s));
    const workers=(ev.staff||[]).filter(s=>ROLE_WORKER.includes(s));
    let pips=bookers.map(s=>`<span class="staff-pip" style="background:${STAFF_COLOR[s]||'#888'}"></span>`).join('');
    if(workers.length){pips+=`<span style="width:1px;height:8px;background:${ts.c}60;display:inline-block;margin:0 1px"></span>`;pips+=workers.map(s=>`<span class="staff-pip" style="background:${STAFF_COLOR[s]||'#888'}"></span>`).join('')}
    chip.innerHTML=`${pips}<span style="overflow:hidden;text-overflow:ellipsis;flex:1">${ev.building} ${ev.room}</span>${isOv?'<span class="warn">⚠</span>':''}`;
    chip.onclick=e=>{e.stopPropagation();openEdit(ev.id)};cell.appendChild(chip);
  });
  if(dayEvs.length>4){const more=document.createElement('div');more.className='more-chip';more.textContent=`+${dayEvs.length-4}건 더`;cell.appendChild(more)}
  cell.onclick=()=>openDayModal(dt,dayEvs,dayLeaves);return cell;
}

function buildOverlapMap(){const map={};events.forEach(ev=>{if(!ev.sortTime)return;(ev.staff||[]).filter(s=>ROLE_WORKER.includes(s)).forEach(s=>{const k=`${ev.date}|${s}|${ev.sortTime}`;map[k]=(map[k]||0)+1})});return map}
function isEvOverlap(ev,map){if(!ev.sortTime)return false;return(ev.staff||[]).filter(s=>ROLE_WORKER.includes(s)).some(s=>(map[`${ev.date}|${s}|${ev.sortTime}`]||0)>1)}
function getFiltered(){return events.filter(e=>(tabStaff==='전체'||(e.staff&&e.staff.includes(tabStaff)))&&(tabType==='전체'||e.type===tabType))}
function switchTab(val,el){tabStaff=val;document.querySelectorAll('.staff-tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function switchType(val,el){tabType=val;document.querySelectorAll('.tf-item').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}

function updateSidebar(filtered){
  const ms=`${curY}-${String(curM+1).padStart(2,'0')}`;
  const mEvs=filtered.filter(e=>e.date?.startsWith(ms));
  document.getElementById('st-total').textContent=mEvs.length;
  document.getElementById('st-install').textContent=mEvs.filter(e=>e.type==='설치').length;
  document.getElementById('st-collect').textContent=mEvs.filter(e=>e.type==='수거').length;
  document.getElementById('st-as').textContent=mEvs.filter(e=>e.type==='AS').length;
}
function updateTabCounts(){
  const ms=`${curY}-${String(curM+1).padStart(2,'0')}`;
  const mEvs=events.filter(e=>e.date?.startsWith(ms));
  document.getElementById('tc-전체').textContent=mEvs.length;
  Object.keys(STAFF_COLOR).forEach(s=>{const el=document.getElementById('tc-'+s);if(el)el.textContent=mEvs.filter(e=>e.staff?.includes(s)).length});
}
function updateLeaveSidebar(){
  const ms=`${curY}-${String(curM+1).padStart(2,'0')}`;
  const mLv=leaves.filter(l=>l.date?.startsWith(ms));
  const el=document.getElementById('leave-list-sb');
  if(!mLv.length){el.innerHTML='<div style="font-size:11px;color:var(--text3)">없음</div>';return}
  el.innerHTML=mLv.sort((a,b)=>a.date.localeCompare(b.date)).map(lv=>{
    const d=new Date(lv.date),sc=STAFF_COLOR[lv.staff]||'#888';
    return `<div class="leave-item"><span class="leave-dot" style="background:${sc}"></span><span style="color:var(--text3);font-size:10px;font-family:'JetBrains Mono'">${d.getMonth()+1}/${d.getDate()}</span><span style="font-size:11px;font-weight:700">${STAFF_NAME[lv.staff]||lv.staff}</span><span style="font-size:9px;background:${sc}20;color:${sc};padding:1px 5px;border-radius:3px;font-weight:700;margin-left:auto">${lv.type}</span></div>`;
  }).join('');
}

function openDayModal(dt,dayEvs,dayLeaves){
  dayDate=fmtDate(dt);
  const week=['일','월','화','수','목','금','토'];
  document.getElementById('day-modal-title').textContent=`${dt.getMonth()+1}월 ${dt.getDate()}일 (${week[dt.getDay()]})`;
  const body=document.getElementById('day-modal-body');
  const overlapMap=buildOverlapMap();
  let html='';
  if(dayLeaves.length){
    html+=`<div style="margin-bottom:10px;display:flex;flex-wrap:wrap;gap:5px">`;
    dayLeaves.forEach(lv=>{const sc=STAFF_COLOR[lv.staff]||'#888';html+=`<span style="font-size:11px;background:${sc}20;color:${sc};border:1px solid ${sc}50;border-radius:5px;padding:2px 9px;font-weight:700">${STAFF_NAME[lv.staff]||lv.staff} ${lv.type}</span>`});
    html+=`</div>`;
  }
  if(!dayEvs.length){html+=`<div class="empty"><span class="empty-icon">📋</span>이 날 일정이 없어요</div>`}
  else{
    dayEvs.forEach(ev=>{
      const ts=TYPE_STYLE[ev.type]||TYPE_STYLE['기타'],isOv=isEvOverlap(ev,overlapMap);
      const bookers=(ev.staff||[]).filter(s=>ROLE_BOOKER.includes(s));
      const workers=(ev.staff||[]).filter(s=>ROLE_WORKER.includes(s));
      const staffHtml=[
        ...bookers.map(s=>`<span class="ev-tag"><span style="width:6px;height:6px;border-radius:50%;background:${STAFF_COLOR[s]};display:inline-block"></span>${STAFF_NAME[s]}</span>`),
        workers.length?`<span style="font-size:9px;color:var(--text3);align-self:center">→ 기사:</span>`:'',
        ...workers.map(s=>`<span class="ev-tag" style="border-color:${STAFF_COLOR[s]}60"><span style="width:6px;height:6px;border-radius:50%;background:${STAFF_COLOR[s]};display:inline-block"></span>${STAFF_NAME[s]}</span>`),
      ].join('');
      const memo=ev.memo?highlightKw(ev.memo):'';
      html+=`<div class="ev-card" onclick="openEdit('${ev.id}')">
        <div class="ev-card-head">
          <span class="ev-type-badge" style="background:${ts.bg};color:${ts.c}">${ev.type}</span>
          <div style="flex:1"><div class="ev-building">${ev.building} ${ev.room}</div><div class="ev-time">${ev.dispTime||'시간 미정'}</div>${isOv?'<div class="warn-badge">⚠ 기사 시간 겹침</div>':''}</div>
        </div>
        <div class="ev-tags">${staffHtml}${ev.phone?`<span class="ev-tag">📞 ${ev.phone}</span>`:''}${ev.pw?`<span class="ev-tag">🔑 ${ev.pw}</span>`:''}${ev.service?`<span class="ev-tag">📡 ${ev.service}</span>`:''}</div>
        ${memo?`<div class="ev-memo">${memo}</div>`:''}
      </div>`;
    });
  }
  body.innerHTML=html; openModal('day-modal');
}
function addFromDay(){closeModal('day-modal');openAddModal(dayDate)}

function highlightKw(text){let t=escHtml(text);KW.forEach(({re,cls})=>{t=t.replace(re,m=>`<span class="${cls}">${m}</span>`)});return t}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function openAddModal(dateStr){
  editId=null;selStaff=[];selType=null;
  document.getElementById('add-modal-title').textContent='새 일정 추가';
  document.getElementById('del-btn').style.display='none';
  clearForm();resetSelectors();
  if(dateStr)document.getElementById('f-date').value=dateStr;
  openModal('add-modal');
}
function openEdit(id){
  closeModal('day-modal');
  const ev=events.find(e=>e.id===id);if(!ev)return;
  editId=id;selStaff=[...(ev.staff||[])];selType=ev.type;
  document.getElementById('add-modal-title').textContent='일정 수정';
  document.getElementById('del-btn').style.display='';
  document.getElementById('f-date').value=ev.date||'';
  document.getElementById('f-disp-time').value=ev.dispTime||'';
  document.getElementById('f-sort-time').value=ev.sortTime||'';
  document.getElementById('f-building').value=ev.building||'';
  document.getElementById('f-room').value=ev.room||'';
  document.getElementById('f-phone').value=ev.phone||'';
  document.getElementById('f-pw').value=ev.pw||'';
  document.getElementById('f-service').value=ev.service||'';
  document.getElementById('f-memo').value=ev.memo||'';
  resetSelectors();
  document.querySelectorAll('.s-btn').forEach(b=>{if(selStaff.includes(b.dataset.s)){b.classList.add('on');const sc=STAFF_COLOR[b.dataset.s];b.style.background=sc;b.style.borderColor=sc;b.style.color='#fff'}});
  document.querySelectorAll('.t-btn').forEach(b=>{if(b.dataset.t===selType)b.classList.add('on')});
  openModal('add-modal');
}
function toggleStaff(btn){
  const s=btn.dataset.s,sc=STAFF_COLOR[s]||'#888';
  if(selStaff.includes(s)){selStaff=selStaff.filter(x=>x!==s);btn.classList.remove('on');btn.style.background=btn.style.borderColor=btn.style.color=''}
  else{selStaff.push(s);btn.classList.add('on');btn.style.background=sc;btn.style.borderColor=sc;btn.style.color='#fff'}
}
function selectType(btn){selType=btn.dataset.t;document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}

async function saveEvent(){
  const date=document.getElementById('f-date').value,building=document.getElementById('f-building').value.trim(),room=document.getElementById('f-room').value.trim();
  if(!date){toast('날짜를 선택해주세요','err');return}
  if(!selStaff.length){toast('담당자를 선택해주세요','err');return}
  if(!building){toast('건물명을 입력해주세요','err');return}
  if(!selType){toast('업무 유형을 선택해주세요','err');return}
  const ev={id:editId||Date.now().toString(),date,dispTime:document.getElementById('f-disp-time').value.trim(),sortTime:document.getElementById('f-sort-time').value,staff:[...selStaff],type:selType,building,room,phone:document.getElementById('f-phone').value.trim(),pw:document.getElementById('f-pw').value.trim(),service:document.getElementById('f-service').value,memo:document.getElementById('f-memo').value.trim()};
  const ok=await upsertEvent(ev);
  if(!ok)return;
  if(editId){const idx=events.findIndex(e=>e.id===editId);if(idx!==-1)events[idx]=ev;toast('수정 완료 ✓')}
  else{events.push(ev);toast('일정 추가 ✓')}
  closeModal('add-modal');render();
}
async function deleteEvent(){
  if(!editId||!confirm('삭제할까요?'))return;
  const ok=await removeEvent(editId);
  if(!ok)return;
  events=events.filter(e=>e.id!==editId);
  closeModal('add-modal');render();toast('삭제되었습니다');
}
function clearForm(){['f-date','f-disp-time','f-sort-time','f-building','f-room','f-phone','f-pw','f-memo'].forEach(id=>{document.getElementById(id).value=''});document.getElementById('f-service').value=''}
function resetSelectors(){document.querySelectorAll('.s-btn').forEach(b=>{b.classList.remove('on');b.style.background=b.style.borderColor=b.style.color=''});document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('on'))}

function openLeaveModal(){renderLeaveEditList();openModal('leave-modal')}
async function addLeave(){
  const date=document.getElementById('lv-date').value,staff=document.getElementById('lv-staff').value,type=document.getElementById('lv-type').value;
  if(!date||!staff){toast('날짜와 담당자를 선택해주세요','err');return}
  const lv={id:Date.now().toString(),date,staff,type};
  const ok=await upsertLeave(lv);
  if(!ok)return;
  leaves.push(lv);renderLeaveEditList();render();toast('연차/반차 추가 ✓');
}
async function deleteLeave(id){
  const ok=await removeLeave(id);
  if(!ok)return;
  leaves=leaves.filter(l=>l.id!==id);renderLeaveEditList();render();
}
function renderLeaveEditList(){
  const el=document.getElementById('leave-edit-list');
  if(!leaves.length){el.innerHTML='<div class="empty"><span class="empty-icon" style="font-size:20px">📅</span>없음</div>';return}
  el.innerHTML=leaves.sort((a,b)=>a.date.localeCompare(b.date)).map(lv=>{
    const d=new Date(lv.date),sc=STAFF_COLOR[lv.staff]||'#888',role=ROLE_BOOKER.includes(lv.staff)?'예약자':'기사';
    return `<div class="leave-row"><span class="leave-dot" style="background:${sc}"></span><span style="font-size:11px;color:var(--text2);font-family:'JetBrains Mono'">${d.getMonth()+1}/${d.getDate()}</span><span style="font-size:12px;font-weight:700;color:${sc}">${STAFF_NAME[lv.staff]||lv.staff}</span><span style="font-size:9px;color:var(--text3)">(${role})</span><span style="font-size:10px;background:${sc}20;color:${sc};padding:1px 6px;border-radius:3px;font-weight:700">${lv.type}</span><button onclick="deleteLeave('${lv.id}')" style="margin-left:auto;background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px">✕</button></div>`;
  }).join('');
}

function doSearch(){const q=prompt('건물명 / 호수 / 연락처로 검색:');if(!q)return;const r=events.filter(e=>e.building?.includes(q)||e.room?.includes(q)||e.phone?.includes(q));if(!r.length){toast('검색 결과 없음','warn');return}const dt=new Date(r[0].date);curY=dt.getFullYear();curM=dt.getMonth();render();toast(`${r.length}건 검색됨`)}
function changeMonth(d){curM+=d;if(curM<0){curM=11;curY--}if(curM>11){curM=0;curY++}render()}
function goToday(){const n=new Date();curY=n.getFullYear();curM=n.getMonth();render()}
function fmtDate(dt){return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.overlay').forEach(o=>{o.addEventListener('click',e=>{if(e.target===o)closeModal(o.id)})});
function toast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(type?' '+type:'');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
</script>
</body>
</html>
